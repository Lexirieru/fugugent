# ---------------------------------------------------------------------------
# CI — every test in the repository, on every push and every pull request.
#
# ## The baseline counts are asserted, not just observed
#
# Each job checks that the number of PASSING tests is at least the recorded
# baseline:
#
#     contracts       212   forge test
#     backend         665   vitest (plus 1 deliberately skipped)
#     fuguguardian    285   vitest
#     fugurebalancer  130   vitest
#     fugugrid        144   vitest
#     fuguyield       141   vitest
#     fugubroker      156   vitest
#     fugutrader      119   vitest
#     fugupilot       147   vitest
#     fugumeter       146   vitest
#     fugusteward     169   vitest
#                   -----
#                    2314
#
# A green suite is not by itself evidence that the suite ran. A `describe` block
# accidentally renamed to `describe.skip`, a glob that stops matching after a file
# move, a `vitest.config.ts` `include` that silently narrows — all of those leave
# the run green while quietly testing less than yesterday. `>=` rather than `==`
# so adding tests never breaks the build; only losing them does. When a suite
# legitimately shrinks, edit the number here in the same commit, so the reduction
# is a reviewed line in a diff instead of a silence.
#
# ## The lockfiles are frozen, and that took a fix
#
# All four `ai/*/pnpm-lock.yaml` files now match their `app/agent/package.json`,
# so CI and the Docker builds install with `--frozen-lockfile` and get one exact
# resolution. They did not for a while: `viem`, `@ai-sdk/openai` and `vitest` had
# been added to package.json without a `pnpm install` being committed, so
# `--frozen-lockfile` failed with ERR_PNPM_OUTDATED_LOCKFILE and CI worked around
# it with `--no-frozen-lockfile`.
#
# That workaround was not free. Resolving fresh on every run is how CI came to
# fail on `Cannot find module '@rolldown/binding-wasm32-wasi'` in all four agents
# at once: platform-specific optional dependencies are exactly what a stale
# lockfile does not record. `pnpm install --lockfile-only` in each agent fixed the
# outdated lockfile and the missing binding together.
#
# ## pnpm versions are pinned per component, deliberately differently
#
# The agents pin 10.24.0 (their `packageManager` field, and their Dockerfiles);
# the backend pins 10.12.4 (`backend/Dockerfile`, which has no `packageManager`
# field to read). CI matches each component's own pin so it tests what the image
# will actually build, rather than what one convenient version happens to do.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
  pull_request:

# A second push to the same ref makes the first run's answer worthless. Cancel it
# — except on main, where a completed run is the gate the deploy workflow waits
# for and cancelling one would strand the deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  contracts:
    name: contracts (forge test, baseline 212)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # forge-std, openzeppelin-contracts and openzeppelin-contracts-upgradeable
          # are git submodules (see .gitmodules). Without this the compile fails on
          # a missing import, not on anything to do with our code.
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned, not `stable`. `stable` is v1.8.1 today, and its Solidity
          # linter aborts (SIGABRT, exit 134) inside `forge build` on this source
          # — after "Compiler run successful!", so the contracts are fine and the
          # crash is in the tooling. v1.7.1 is what the contracts were written,
          # tested and verified on BscScan with; CI should run that, not whatever
          # `stable` moves to next.
          version: v1.7.1

      - name: forge build
        working-directory: contracts
        run: forge build

      - name: forge test
        working-directory: contracts
        # foundry.toml's [rpc_endpoints] interpolates ${BSC_TESTNET_RPC_URL}, but
        # no test forks, so it is only read if a --fork-url is requested. Left
        # unset on purpose: CI must never depend on a testnet being reachable.
        run: |
          set -o pipefail
          forge test | tee forge-test.log

      - name: assert the test count has not regressed
        working-directory: contracts
        run: |
          set -euo pipefail
          baseline=212
          # "Ran 10 test suites ...: 150 tests passed, 0 failed, 0 skipped (150 total tests)"
          actual=$(grep -oE '[0-9]+ tests passed' forge-test.log | tail -1 | grep -oE '[0-9]+')
          echo "forge: $actual passed, baseline $baseline"
          if [ "$actual" -lt "$baseline" ]; then
            echo "::error::contracts test count fell from $baseline to $actual — tests were lost, not fixed."
            exit 1
          fi

  backend:
    name: backend (vitest, baseline 665)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Matches backend/Dockerfile. See the header.
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: install
        working-directory: backend
        # Frozen: this lockfile IS in sync with its package.json (verified), so a
        # drift here should fail the build rather than be papered over.
        run: pnpm install --frozen-lockfile

      - name: typecheck
        working-directory: backend
        # tsconfig.json deliberately includes src/**/__tests__ so this checks the
        # tests too — the reason backend/Dockerfile needs a separate
        # tsconfig.build.json.
        run: pnpm typecheck

      - name: test
        working-directory: backend
        # The suite runs against @electric-sql/pglite, an in-process Postgres, so
        # no service container and no DATABASE_URL are needed.
        env:
          # vitest colours its summary whenever CI is set, and `tee` keeps the
          # escape codes, so "Tests  484 passed" reaches the log as
          # "Tests  <ESC>[1m484 passed<ESC>[22m" and the assert below matches
          # nothing. That is how five green suites reported a failure.
          NO_COLOR: '1'
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee vitest.log

      - name: assert the test count has not regressed
        working-directory: backend
        run: |
          set -uo pipefail
          baseline=665
          # "Tests  484 passed | 1 skipped (485)" — the PASSED figure is the one
          # that matters; a test converted to `.skip` must show up as a loss.
          #
          # The sed strips ANSI escapes. NO_COLOR on the step above should mean
          # there are none, but this assert is the only thing standing between a
          # lost test and a green build, so it does not depend on that holding.
          actual=$(sed -E 's/\x1b\[[0-9;]*m//g' vitest.log \
            | grep -oE 'Tests[[:space:]]+[0-9]+ passed' | tail -1 | grep -oE '[0-9]+' || true)
          if [ -z "$actual" ]; then
            echo "::error::could not find a test count in backend/vitest.log — the assert cannot vouch for anything, so this is a failure, not a pass."
            tail -20 vitest.log
            exit 1
          fi
          echo "backend: $actual passed, baseline $baseline"
          if [ "$actual" -lt "$baseline" ]; then
            echo "::error::backend test count fell from $baseline to $actual — tests were lost, not fixed."
            exit 1
          fi

  agents:
    name: ${{ matrix.agent }} (vitest, baseline ${{ matrix.baseline }})
    runs-on: ubuntu-latest
    strategy:
      # One agent failing should not hide the state of the other three.
      fail-fast: false
      matrix:
        include:
          - agent: fuguguardian
            baseline: 285
          - agent: fugurebalancer
            baseline: 130
          - agent: fugugrid
            baseline: 144
          - agent: fuguyield
            baseline: 141
          # The five newest agents. Added to this matrix in the same commit that
          # merged them, because a suite CI does not run is a suite nobody is
          # checking: their 737 tests were green on one laptop and nowhere else.
          - agent: fugubroker
            baseline: 156
          - agent: fugutrader
            baseline: 119
          - agent: fugupilot
            baseline: 147
          - agent: fugumeter
            baseline: 146
          - agent: fugusteward
            baseline: 169
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # The `packageManager` field of every ai/*/package.json, and the pin in
          # every agent Dockerfile.
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ai/${{ matrix.agent }}/pnpm-lock.yaml

      - name: install
        working-directory: ai/${{ matrix.agent }}
        # The workspace root, which is where the lockfile covering app/agent lives.
        # Frozen: a drift between lockfile and package.json should fail the build
        # rather than be resolved away silently. See the header.
        run: pnpm install --frozen-lockfile

      - name: typecheck
        working-directory: ai/${{ matrix.agent }}
        # fuguguardian alone has a tsconfig.scripts.json (its typecheck script
        # covers scripts/ as well as src/); the other three point `typecheck` at
        # tsconfig.json. Running the package's own script keeps that difference
        # where it belongs — in the package.
        run: pnpm --filter ${{ matrix.agent }}-agent run typecheck

      - name: test
        working-directory: ai/${{ matrix.agent }}
        env:
          # See the backend job's test step: colour in the log breaks the assert.
          NO_COLOR: '1'
        run: |
          set -o pipefail
          pnpm --filter ${{ matrix.agent }}-agent run test 2>&1 | tee vitest.log

      - name: assert the test count has not regressed
        working-directory: ai/${{ matrix.agent }}
        run: |
          set -uo pipefail
          baseline=${{ matrix.baseline }}
          # See the backend job for why the escapes are stripped and why a missing
          # count is a failure rather than an empty comparison.
          actual=$(sed -E 's/\x1b\[[0-9;]*m//g' vitest.log \
            | grep -oE 'Tests[[:space:]]+[0-9]+ passed' | tail -1 | grep -oE '[0-9]+' || true)
          if [ -z "$actual" ]; then
            echo "::error::could not find a test count in ai/${{ matrix.agent }}/vitest.log — the assert cannot vouch for anything, so this is a failure, not a pass."
            tail -20 vitest.log
            exit 1
          fi
          echo "${{ matrix.agent }}: $actual passed, baseline $baseline"
          if [ "$actual" -lt "$baseline" ]; then
            echo "::error::${{ matrix.agent }} test count fell from $baseline to $actual — tests were lost, not fixed."
            exit 1
          fi

  # A single job the branch-protection rule and the deploy workflow can point at,
  # so neither has to enumerate a matrix that will grow.
  # ── theme ─────────────────────────────────────────────────────────────────
  #
  # The palette lives once, in `theme/tokens.css`. Each app imports a committed
  # copy of it rather than the file itself, because a Vercel build only sees its
  # own project directory and an import reaching above it resolves on a laptop
  # and fails in CI — which is exactly how two landing-page deploys died while
  # the production alias quietly stayed four hours old.
  #
  # A committed copy can drift from its source, so this job regenerates both and
  # fails if anything changed. That turns "someone edited the copy" from a bug
  # that ships into a red check.
  theme:
    name: theme tokens are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: regenerate and diff
        run: |
          set -euo pipefail
          node scripts/sync-theme-tokens.mjs
          if ! git diff --quiet -- '*theme-tokens.generated.css'; then
            echo "::error::the generated token copies differ from theme/tokens.css."
            echo "::error::Run 'node scripts/sync-theme-tokens.mjs' and commit the result."
            git diff -- '*theme-tokens.generated.css'
            exit 1
          fi
          echo "theme tokens in sync"

  ci:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [contracts, backend, agents, theme]
    if: always()
    steps:
      - name: verify every suite passed
        run: |
          set -euo pipefail
          # `needs.*.result` is 'success' only when every matrix leg succeeded.
          # Checked explicitly because `needs:` alone treats a skipped job as
          # satisfied, and a suite that never ran must not read as a pass.
          for r in "${{ needs.contracts.result }}" "${{ needs.backend.result }}" "${{ needs.agents.result }}" "${{ needs.theme.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::a CI suite did not succeed (contracts=${{ needs.contracts.result }} backend=${{ needs.backend.result }} agents=${{ needs.agents.result }} theme=${{ needs.theme.result }})"
              exit 1
            fi
          done
          echo "all 2314 tests green"

  # ── images ────────────────────────────────────────────────────────────────
  #
  # Built here rather than on the VPS. That machine has 2 vCPUs and 813 MB of
  # free RAM and is running someone else's production; five `pnpm install` + `tsc`
  # passes on it would at best take an age and at worst OOM something that is not
  # ours. The VPS only ever pulls.
  #
  # Only on a push to main, and only after the gate above is green — an image
  # tagged with a commit whose tests failed should not exist to be deployed by
  # accident.
  images:
    name: build & push images
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          # The agent contexts are the workspace roots, not app/agent: the
          # lockfile that covers app/agent lives one level up. See each
          # Dockerfile's header.
          - name: fuguguardian
            context: ./ai/fuguguardian
            dockerfile: ./ai/fuguguardian/app/agent/Dockerfile
          - name: fugurebalancer
            context: ./ai/fugurebalancer
            dockerfile: ./ai/fugurebalancer/app/agent/Dockerfile
          - name: fugugrid
            context: ./ai/fugugrid
            dockerfile: ./ai/fugugrid/app/agent/Dockerfile
          - name: fuguyield
            context: ./ai/fuguyield
            dockerfile: ./ai/fuguyield/app/agent/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The automatic per-run token. No long-lived registry credential is
          # stored for pushing.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: lower-case the image prefix
        id: prefix
        # GHCR rejects an upper-case path, and `github.repository` preserves the
        # owner's capitalisation.
        run: echo "value=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Two tags on purpose. The SHA tag is what the deploy pins and what a
          # rollback names; `latest` is only a convenience for a human running
          # `docker compose pull` by hand. Deploying `latest` would make "which
          # code is live" unanswerable.
          tags: |
            ${{ steps.prefix.outputs.value }}/${{ matrix.name }}:${{ github.sha }}
            ${{ steps.prefix.outputs.value }}/${{ matrix.name }}:latest
          # linux/amd64 only: the VPS is x86_64, and building arm64 under QEMU
          # would roughly double the job for an artefact nothing pulls.
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
