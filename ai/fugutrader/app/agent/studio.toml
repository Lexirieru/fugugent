[project]
name = "fugutrader-agent"

[stack]
# Project-lifetime facts: which runtime adapter recipe this Agent was
# scaffolded against. doctor / dev / deploy read these to know what to
# check, load, and route. runtime: agentcore | azure-foundry.
runtime = "agentcore"
# Public faces exposed by this one runtime and signer (canonical order):
#   A2A — serveA2a: agent card + negotiate/notify_funded skills.
#   MCP — streamable-HTTP /mcp: negotiate (signed quote) + notify_funded
#         (verify → deliver → submit, synchronously within the tool call) +
#         read-only chain tools.
#   X402 or MPP — publish exactly one sibling B402 seller route (/x402 or
#          /mpp). Payment-only still uses A2A as the cloud carrier but hides
#          that native face at the public gateway.
protocols = ["A2A","MCP","X402"]

[network]
default = "bsc-testnet"

[wallet]
# Altana custody: the encrypted ADMIN keystore stays under the workspace
# .studio directory. The running Agent receives only the bounded session file.
kind = "altana"
keystore_dir = "../../.studio/wallets"
session_file = "../../.studio/wallets/altana-session.json"
# address = "0x..."   # filled by `bag wallet new`; session must match it
address = "0x1B82F72346a8553a968fafD6AC07A21d4A88589f"

[llm]
provider = "openai"
model = "openai/gpt-5.6-luna"
# dGrid is OpenAI-compatible. Asynchronous explanation only: measured latency is
# 30-46 seconds, so it never sits on a path that decides about money.
base_url = "https://api.dgrid.ai/v1"

[storage]
# Deliverables written to local disk (file://). Offline-dev only —
# does NOT survive deploy. Path from STORAGE_LOCAL_PATH.
kind = "local"


[payments.b402_seller]
# Public X402 seller rail mounted at /x402. Credentials stay in
# <workspace>/.studio/.env.local and are issued per B402 environment.
#
# SWITCHED OFF, and not because selling per call is out of scope: it is the whole point of
# this agent. This particular rail needs merchant credentials issued by a Binance developer
# account, which this project does not have and cannot apply for from the network it is
# built on. Leaving it on would produce a route that demands payment and then rejects every
# payment that arrives.
#
# What this agent sells instead is at POST /fugu-x402, built on
# `@altananetwork/x402-server`, which needs no merchant account: an address to be paid at
# and a separate key that pays for delivering the settlement transaction. See
# `src/x402/route.ts` and set FUGU_X402_SELLER_ENABLED=1 to switch it on.
enabled = false
# Decimal USD string; "0" is explicit FREE passthrough and bypasses B402.
price_usd = "0.01"
# v1 supports United Stables (U) through EIP-3009 only.
assets = ["U"]
# Empty means the agent wallet receives payment.
pay_to = ""
# Payment settles before work; this bounds only the post-settlement work.
work_timeout_seconds = 60
# Optional Bazaar metadata can be added later as scalar JSON fields under
# [payments.b402_seller.bazaar]: info_json, schema_json, description,
# and route_template.
