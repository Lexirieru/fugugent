# api.hellofugu.xyz  ->  the HelloFugu backend, and the agents' A2A endpoints.
#
# This machine already serves someone else's production (swipenit) on the same
# nginx. Everything here is scoped to its own server_name and its own upstreams;
# nothing in this file touches the default site or that one.
#
# TLS is added by certbot, which rewrites this file in place. The block below is
# what exists before the first certificate is issued, and what serves the ACME
# challenge that gets one.

# The API is read-mostly and public, but a single client can still bury a 2 vCPU
# box. 20 requests/second with a burst of 40 leaves plenty of room for a page
# load (which fires a handful of requests) while capping a runaway loop.
limit_req_zone $binary_remote_addr zone=hellofugu_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.hellofugu.xyz agents.hellofugu.xyz;

    # Let certbot answer here without a redirect swallowing the challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` rather than the standalone `http2 on;`. This box runs
    # nginx 1.24, and the separate directive only exists from 1.25.1; on 1.24 it
    # is an "unknown directive" that fails the config test outright.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.hellofugu.xyz;

    # certbot fills these in. Until it has run, this block is not loaded.
    ssl_certificate     /etc/letsencrypt/live/api.hellofugu.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hellofugu.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # This host serves JSON to a browser on another origin. It never serves HTML,
    # so nothing here can be framed, sniffed into a script, or leak a referrer.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Deliberately NOT set here: Access-Control-Allow-Origin. The application
    # decides that, from its own allowlist, and it has to: it varies per request
    # and nginx would have to duplicate the list to get it right. Two copies of an
    # allowlist is one copy too many. See backend/src/config.ts.

    client_max_body_size 1m;

    location / {
        limit_req zone=hellofugu_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}

# agents.hellofugu.xyz  ->  each agent's A2A endpoint, one path prefix each.
#
# One host rather than four subdomains, because these are four ports on one
# machine and four certificates would be four things to renew.
#
# The trailing slash on both sides of `proxy_pass` is load-bearing: it strips the
# prefix, so `/guardian/.well-known/agent-card.json` reaches the agent as
# `/.well-known/agent-card.json`, which is where it actually serves it.
#
# The card each agent publishes carries its own URL, and an A2A client calls
# whatever is in that field. Left alone it says `http://localhost:9000/`, which
# is correct on the machine and useless anywhere else, so every agent is given
# AGENTCORE_RUNTIME_URL in the root .env. If a card here ever advertises
# localhost again, that variable is what is missing.
server {
    # `listen ... http2` rather than the standalone `http2 on;`. This box runs
    # nginx 1.24, and the separate directive only exists from 1.25.1; on 1.24 it
    # is an "unknown directive" that fails the config test outright.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agents.hellofugu.xyz;

    ssl_certificate     /etc/letsencrypt/live/api.hellofugu.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hellofugu.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;

    location = / {
        default_type application/json;
        return 200 '{"agents":["/guardian/","/rebalancer/","/grid/","/yield/"]}';
    }

    location /guardian/   { limit_req zone=hellofugu_api burst=40 nodelay; proxy_pass http://127.0.0.1:59001/; include /etc/nginx/proxy_params; }
    location /rebalancer/ { limit_req zone=hellofugu_api burst=40 nodelay; proxy_pass http://127.0.0.1:59002/; include /etc/nginx/proxy_params; }
    location /grid/       { limit_req zone=hellofugu_api burst=40 nodelay; proxy_pass http://127.0.0.1:59003/; include /etc/nginx/proxy_params; }
    location /yield/      { limit_req zone=hellofugu_api burst=40 nodelay; proxy_pass http://127.0.0.1:59004/; include /etc/nginx/proxy_params; }
}
