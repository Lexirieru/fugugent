# ---------------------------------------------------------------------------
# Tumpukan lokal Fugugent: postgres, redis, api.
#
#     docker compose up -d --build
#     curl -s localhost:8787/api/health | jq
#
# ## Yang perlu diketahui sebelum mengubah berkas ini
#
# 1. **Tidak ada satu pun nilai rahasia di sini.** Kata sandi Postgres/Redis
#    dan kedua API key dibaca dari environment (`.env` di root untuk
#    interpolasi compose, `backend/.env` untuk proses api). Default
#    `fugugent_local_dev` di bawah adalah kata sandi pengembangan yang memang
#    tidak rahasia — jangan pernah menggantinya dengan kata sandi sungguhan
#    di berkas yang di-commit.
#
# 2. **Port host sengaja digeser** (55432 / 56379). Mesin pengembang di tim ini
#    sudah menjalankan Postgres di :5432; memakai port yang sama membuat
#    container gagal menyala dengan pesan yang menyesatkan, atau — lebih buruk —
#    membuat `psql localhost` menyentuh database yang salah.
#
# 3. **`api` menunggu postgres & redis benar-benar sehat**, bukan sekadar
#    "sudah dibuat". Tapi itu kenyamanan, bukan syarat: `src/index.ts` boot
#    tanpa `DATABASE_URL` sekalipun, dan `/api/health` yang melaporkan cache
#    tidak ada jauh lebih berguna daripada proses yang menolak menyala.
#
# 4. **Redis belum dipakai kode mana pun.** Ia disiapkan untuk scheduler
#    BullMQ (tanggung jawab #4 di `backend/CLAUDE.md`) dan sengaja sudah
#    dinyalakan di sini supaya bagian itu tidak perlu menyentuh compose lagi.
# ---------------------------------------------------------------------------

name: fugugent

services:
  postgres:
    image: postgres:16-alpine
    container_name: fugugent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fugugent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fugugent_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fugugent}
      # Tanpa ini, initdb memakai `trust` dan container menerima koneksi apa pun
      # tanpa kata sandi begitu port-nya terekspos.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `-U`/`-d` eksplisit: `pg_isready` tanpa keduanya memakai user `root`
      # dan melaporkan sehat sebelum database aplikasi benar-benar ada.
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fugugent} -d ${POSTGRES_DB:-fugugent}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [fugugent]

  redis:
    image: redis:7-alpine
    container_name: fugugent-redis
    restart: unless-stopped
    # `--save 60 1` cukup untuk antrean job; AOF tidak dibutuhkan karena job
    # yang hilang saat restart dijadwalkan ulang oleh scheduler, bukan dipulihkan.
    command: >
      sh -c 'exec redis-server --save 60 1 --appendonly no
      ${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [fugugent]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fugugent-api
    restart: unless-stopped
    # Kredensial upstream (SCAN8004_API_KEY, DGRID_API_KEY) HANYA dari sini.
    # Sengaja tidak diulang di `environment:` — `environment` menang atas
    # `env_file`, jadi menuliskannya di sana dengan default kosong justru
    # akan menghapus key yang sudah benar terisi di `backend/.env`.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 8787
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-fugugent}:${POSTGRES_PASSWORD:-fugugent_local_dev}@postgres:5432/${POSTGRES_DB:-fugugent}
      REDIS_URL: redis://${REDIS_PASSWORD:+:$REDIS_PASSWORD@}redis:6379
      # Wajib: default bawaan SDK memakai domain `binance.org` yang terbukti
      # diblokir dari jaringan Indonesia.
      RPC_URL: ${RPC_URL:-https://data-seed-prebsc-1-s1.bnbchain.org:8545}
      SCAN8004_BASE_URL: ${SCAN8004_BASE_URL:-https://api.8004scan.io/api/v1}
      DGRID_BASE_URL: ${DGRID_BASE_URL:-https://api.dgrid.ai/v1}
    ports:
      - "${API_HOST_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [fugugent]

volumes:
  postgres-data:
  redis-data:

networks:
  fugugent:
    name: fugugent
