# ---------------------------------------------------------------------------
# The local Fugugent stack: postgres, redis, api.
#
#     docker compose up -d --build
#     curl -s localhost:8787/api/health | jq
#
# ## What to know before changing this file
#
# 1. **There is not a single secret value here.** The Postgres/Redis passwords
#    and both API keys are read from the environment (`.env` at the root for
#    compose interpolation, `backend/.env` for the api process). The
#    `fugugent_local_dev` default below is a development password that is
#    genuinely not secret — never replace it with a real password in a committed
#    file.
#
# 2. **The host ports are deliberately shifted** (55432 / 56379). Developer
#    machines on this team already run Postgres on :5432; using the same port
#    makes the container fail to start with a misleading message, or — worse —
#    makes `psql localhost` reach the wrong database.
#
# 3. **`api` waits for postgres & redis to be genuinely healthy**, not merely
#    "created". But that is a convenience, not a requirement: `src/index.ts`
#    boots even without `DATABASE_URL`, and an `/api/health` that reports the
#    cache is missing is far more useful than a process that refuses to start.
#
# 4. **Redis is not used by any code yet.** It is prepared for the BullMQ
#    scheduler (responsibility #4 in `backend/CLAUDE.md`) and is deliberately
#    already running here so that piece of work need not touch compose again.
# ---------------------------------------------------------------------------

name: fugugent

services:
  postgres:
    image: postgres:16-alpine
    container_name: fugugent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fugugent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fugugent_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fugugent}
      # Without this, initdb uses `trust` and the container accepts any
      # connection with no password the moment its port is exposed.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `-U`/`-d` explicitly: without them `pg_isready` uses the `root` user and
      # reports healthy before the application database actually exists.
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fugugent} -d ${POSTGRES_DB:-fugugent}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [fugugent]

  redis:
    image: redis:7-alpine
    container_name: fugugent-redis
    restart: unless-stopped
    # `--save 60 1` is enough for a job queue; AOF is not needed because a job
    # lost on restart is rescheduled by the scheduler, not recovered.
    command: >
      sh -c 'exec redis-server --save 60 1 --appendonly no
      ${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [fugugent]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fugugent-api
    restart: unless-stopped
    # Upstream credentials (SCAN8004_API_KEY, DGRID_API_KEY) come ONLY from here.
    # Deliberately not repeated under `environment:` — `environment` wins over
    # `env_file`, so writing them there with an empty default would erase the
    # keys already correctly filled in in `backend/.env`.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 8787
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-fugugent}:${POSTGRES_PASSWORD:-fugugent_local_dev}@postgres:5432/${POSTGRES_DB:-fugugent}
      REDIS_URL: redis://${REDIS_PASSWORD:+:$REDIS_PASSWORD@}redis:6379
      # Mandatory: the SDK default uses the `binance.org` domain, which is proven
      # to be blocked from Indonesian networks.
      RPC_URL: ${RPC_URL:-https://data-seed-prebsc-1-s1.bnbchain.org:8545}
      SCAN8004_BASE_URL: ${SCAN8004_BASE_URL:-https://api.8004scan.io/api/v1}
      DGRID_BASE_URL: ${DGRID_BASE_URL:-https://api.dgrid.ai/v1}
    ports:
      - "${API_HOST_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [fugugent]

volumes:
  postgres-data:
  redis-data:

networks:
  fugugent:
    name: fugugent
